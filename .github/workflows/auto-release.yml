name: auto-release

# Fully automatic releases:
# - When the weekly "sync upstream" pull request is merged into main, this
#   workflow creates a version tag (v<upstream-version>-<date>) and starts the
#   Windows build on that tag. The build then publishes the release with the
#   zip attached.
# - Can also be run manually any time from Actions -> Auto release.

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'sync/upstream')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version and create tag
        id: tag
        run: |
          git remote add upstream https://github.com/ollama/ollama.git 2>/dev/null || true
          git fetch --tags upstream 2>/dev/null || true
          VER=$(git tag --merged HEAD --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)
          VER=${VER#v}
          if [ -z "$VER" ]; then VER="0.0.0"; fi
          TAG="v${VER}-$(date +%Y%m%d)"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; skipping."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"
          echo "created=true" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Start the Windows build on the new tag
        if: steps.tag.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run build.yml --ref "${{ steps.tag.outputs.tag }}"
