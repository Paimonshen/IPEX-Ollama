name: Build Windows (SYCL / Intel oneAPI)

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-2022
    env:
      OLLAMA_VERSION: 0.32.6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve Ollama version
        shell: bash
        run: |
          git remote add upstream https://github.com/ollama/ollama.git 2>/dev/null || true
          git fetch --tags upstream 2>/dev/null || true
          VER=$(git tag --merged HEAD --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)
          if [ -z "$VER" ]; then
            VER="${{ env.OLLAMA_VERSION }}"
          fi
          echo "OLLAMA_VERSION=${VER#v}" >> "$GITHUB_ENV"

      - name: Setup MSVC (cl)
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Intel oneAPI Base Toolkit
        shell: powershell
        run: |
          $url = "https://registrationcenter-download.intel.com/akdlm/IRC_NAS/076e961b-2c29-48a8-9203-c96f00e7051b/intel-oneapi-base-toolkit-2025.3.1.35_offline.exe"
          Invoke-WebRequest -Uri $url -OutFile oneapi.exe
          # Full silent install using Intel's documented command for 2025.3.1.
          # Component-selective installs are unreliable across versions (they can
          # exit 0 without installing the DPC++ compiler), so install everything.
          & .\oneapi.exe -a --silent --eula accept
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sv = Get-ChildItem "C:\Program Files*\Intel\oneAPI" -Filter setvars.bat -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          $icx = Get-ChildItem "C:\Program Files*\Intel\oneAPI" -Filter icx.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $sv -or -not $icx) {
            Write-Error "oneAPI install incomplete: setvars.bat=$($null -ne $sv), icx.exe=$($null -ne $icx)"
            exit 1
          }
          $root = Split-Path -Parent $sv.FullName
          # Append to GITHUB_ENV without a BOM (PowerShell 5.1 Out-File would add
          # one and corrupt the variable name) and without overwriting earlier lines.
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "ONEAPI_ROOT=$root`n", (New-Object System.Text.UTF8Encoding($false)))
          Write-Output "Using oneAPI at $root (icx: $($icx.FullName))"

      - name: Configure
        shell: cmd
        run: |
          if "%ONEAPI_ROOT%"=="" (
            echo [ERROR] ONEAPI_ROOT is empty - the oneAPI install step did not export it.
            exit /b 1
          )
          echo ONEAPI_ROOT=%ONEAPI_ROOT%
          call "%ONEAPI_ROOT%\setvars.bat" intel64 --force >nul
          cmake -S . -B build -G Ninja -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DOLLAMA_LLAMA_BACKENDS=sycl -DOLLAMA_VERSION=%OLLAMA_VERSION% -DCMAKE_BUILD_TYPE=Release -DGGML_CCACHE=OFF

      - name: Build
        shell: cmd
        run: |
          if "%ONEAPI_ROOT%"=="" (
            echo [ERROR] ONEAPI_ROOT is empty - the oneAPI install step did not export it.
            exit /b 1
          )
          call "%ONEAPI_ROOT%\setvars.bat" intel64 --force >nul
          cmake --build build --config Release --parallel 2

      - name: Assemble package
        shell: powershell
        run: |
          $out = "release\IPEX-Ollama"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item ollama.exe $out\
          Copy-Item build\lib\ollama "$out\lib\ollama" -Recurse -Force
          Set-Content -Path "$out\start-ollama.bat" -Value "@echo off`r`ncd /d `"%~dp0`"`r`nollama serve`r`n" -Encoding ascii
          Compress-Archive -Path $out -DestinationPath release\IPEX-Ollama.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: IPEX-Ollama
          path: release/IPEX-Ollama.zip

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/IPEX-Ollama.zip
